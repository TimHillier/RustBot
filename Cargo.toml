[package]
name = "RustBot"
version = "0.5.0"
authors = ["Tim Hillier tim.r.hillier@gmail.com"]
edition = "2024"

[dependencies]
serenity = { version = "0.12.4", default-features = false, features = [
    "client",
    "gateway",
    "rustls_backend",
    "model",
    "cache",
    "standard_framework",
    "framework",
    "utils",
    "voice",
] }
tokio = { version = "1.32.0", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.9.8"
rand = "0.9.2"
sqlx = { version = "0.8.6", features = [
    "runtime-tokio-rustls",
    "tls-rustls",
    "sqlite",
] }
poise = "0.6.1"
thousands = "0.2.0"
quickchart-rs = { version = "0.1.1" }
chrono = "0.4.42"
reqwest = "0.11.27"
thiserror = "1.0.69"
url = "2.5.7"
urlencoding = "2.1.3"
